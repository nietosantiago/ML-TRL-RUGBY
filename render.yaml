services:
  - type: web
    name: trl-rugby-api
    env: python
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CURRENT_SEASON
        value: 2026
      - key: DATABASE_URL
        fromDatabase:
          name: trl-rugby-db
          property: connectionString

databases:
  - name: trl-rugby-db
    plan: free
    region: oregon
