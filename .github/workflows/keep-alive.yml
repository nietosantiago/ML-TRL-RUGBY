name: Keep-alive del backend

# Los Spaces gratuitos de HF se duermen tras 48h sin tráfico.
# Un ping cada 12h los mantiene despiertos.
on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 30 --max-time 180 \
            "https://TODO-SUBDOMINIO.hf.space/health"
